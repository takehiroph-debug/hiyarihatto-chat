<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林業ヒヤリハット報告チャット</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f9fafb;
            line-height: 1.6;
        }
        .container {
            max-width: 56rem;
            margin: 0 auto;
            padding: 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #15803d;
            color: white;
            padding: 1rem;
            border-radius: 0.5rem 0.5rem 0 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .header p {
            font-size: 0.875rem;
            color: #bbf7d0;
            margin-top: 0.25rem;
        }
        .chat-area {
            flex: 1;
            background-color: white;
            padding: 1rem;
            overflow-y: auto;
            border-left: 1px solid #e5e7eb;
            border-right: 1px solid #e5e7eb;
        }
        .chat-message {
            animation: fadeIn 0.3s ease-in;
            margin-bottom: 1rem;
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-left {
            justify-content: flex-start;
        }
        .message-right {
            justify-content: flex-end;
        }
        .bubble {
            max-width: 80%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .bubble-bot {
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .bubble-user {
            background-color: #16a34a;
            color: white;
        }
        .typing-indicator {
            display: inline-block;
        }
        .typing-indicator span {
            animation: blink 1.4s infinite;
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #9ca3af;
            margin: 0 2px;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes blink {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }
        .recording {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .input-area {
            background-color: white;
            padding: 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 0 0 0.5rem 0.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-row {
            display: flex;
            gap: 0.5rem;
        }
        .btn {
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }
        .btn-voice {
            background-color: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 3.5rem;
        }
        .btn-voice:hover {
            background-color: #1d4ed8;
        }
        .btn-send {
            background-color: #16a34a;
            color: white;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }
        .btn-send:hover {
            background-color: #15803d;
        }
        .text-input {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 1rem;
        }
        .text-input:focus {
            outline: none;
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
        }
        .checkbox-row {
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            color: #374151;
        }
        .checkbox {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
        }
        .status-text {
            font-size: 0.875rem;
            color: #6b7280;
        }
        .button-area {
            margin-top: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .btn-quick {
            background-color: #dcfce7;
            color: #166534;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-quick:hover {
            background-color: #bbf7d0;
        }
        .modal {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
        }
        .modal.hidden {
            display: none;
        }
        .modal-content {
            background-color: white;
            border-radius: 0.5rem;
            max-width: 48rem;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
        }
        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 1rem;
        }
        .report-content {
            font-size: 0.875rem;
            line-height: 1.75;
        }
        .report-section {
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 0.75rem;
        }
        .report-section:last-child {
            border-bottom: none;
        }
        .report-label {
            font-weight: bold;
            color: #374151;
            margin-bottom: 0.25rem;
        }
        .report-value {
            color: #1f2937;
        }
        .report-info {
            background-color: #f9fafb;
            padding: 1rem;
            border-radius: 0.25rem;
        }
        .report-alert {
            background-color: #f0fdf4;
            border-left: 4px solid #16a34a;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .modal-buttons {
            margin-top: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .btn-modal {
            flex: 1;
            min-width: 120px;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-green {
            background-color: #16a34a;
            color: white;
        }
        .btn-green:hover {
            background-color: #15803d;
        }
        .btn-blue {
            background-color: #2563eb;
            color: white;
        }
        .btn-blue:hover {
            background-color: #1d4ed8;
        }
        .btn-purple {
            background-color: #9333ea;
            color: white;
        }
        .btn-purple:hover {
            background-color: #7e22ce;
        }
        .btn-gray {
            background-color: #6b7280;
            color: white;
        }
        .btn-gray:hover {
            background-color: #4b5563;
        }
        .btn-light-gray {
            background-color: #9ca3af;
            color: white;
        }
        .btn-light-gray:hover {
            background-color: #6b7280;
        }
        .story-content {
            white-space: pre-wrap;
            font-size: 0.875rem;
            line-height: 1.75;
            color: #1f2937;
            background-color: #fffbeb;
            padding: 1rem;
            border-radius: 0.25rem;
        }
        @media (max-width: 640px) {
            .modal-buttons {
                flex-direction: column;
            }
            .btn-modal {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌲 林業ヒヤリハット報告チャット</h1>
            <p>マイクボタンを押して話すか、テキストで入力してください</p>
        </div>

        <div id="chatArea" class="chat-area"></div>

        <div class="input-area">
            <div class="input-row">
                <button id="voiceButton" class="btn btn-voice" onclick="toggleVoiceInput()" title="音声入力">
                    <span id="voiceIcon" style="font-size: 1.5rem;">🎤</span>
                </button>
                <input 
                    type="text" 
                    id="userInput" 
                    class="text-input"
                    placeholder="メッセージを入力するか、マイクボタンで音声入力..."
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                />
                <button class="btn btn-send" onclick="sendMessage()">送信</button>
            </div>
            <div class="checkbox-row">
                <label class="checkbox-label">
                    <input 
                        type="checkbox" 
                        id="autoReadToggle" 
                        class="checkbox"
                        checked
                        onchange="toggleAutoRead()"
                    />
                    <span>返答を音声で読み上げる</span>
                </label>
                <span id="voiceStatus" class="status-text"></span>
            </div>
            <div id="buttonArea" class="button-area"></div>
        </div>

        <div id="reportModal" class="modal hidden">
            <div class="modal-content">
                <h2 class="modal-title" id="modalTitle">📋 ヒヤリハット報告書</h2>
                <div id="reportContent"></div>
                <div class="modal-buttons" id="modalButtons">
                    <button class="btn-modal btn-green" onclick="copyReport()">📋 コピーする</button>
                    <button class="btn-modal btn-blue" onclick="downloadReport()">💾 ダウンロード</button>
                    <button class="btn-modal btn-purple" onclick="generateStory()">📖 物語にする</button>
                    <button class="btn-modal btn-gray" onclick="closeModal()">閉じる</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let recognition = null;
        let isRecording = false;
        let autoRead = true;
        let currentUtterance = null;

        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = function() {
                    isRecording = true;
                    document.getElementById('voiceIcon').textContent = '⏹️';
                    document.getElementById('voiceButton').classList.add('recording');
                    document.getElementById('voiceStatus').textContent = '聞いています...';
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('userInput').value = transcript;
                    document.getElementById('voiceStatus').textContent = '認識しました';
                };

                recognition.onerror = function(event) {
                    console.error('音声認識エラー:', event.error);
                    document.getElementById('voiceStatus').textContent = 'エラーが発生しました: ' + event.error;
                    stopRecording();
                };

                recognition.onend = function() {
                    stopRecording();
                };
            } else {
                alert('お使いのブラウザは音声認識に対応していません。Chrome、Edge、Safariをお試しください。');
            }
        }

        function toggleVoiceInput() {
            if (!recognition) {
                initSpeechRecognition();
            }

            if (isRecording) {
                recognition.stop();
            } else {
                if (currentUtterance) {
                    speechSynthesis.cancel();
                }
                recognition.start();
            }
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('voiceIcon').textContent = '🎤';
            document.getElementById('voiceButton').classList.remove('recording');
            setTimeout(function() {
                document.getElementById('voiceStatus').textContent = '';
            }, 3000);
        }

        function toggleAutoRead() {
            autoRead = document.getElementById('autoReadToggle').checked;
        }

        function speakText(text) {
            if (!autoRead) return;

            speechSynthesis.cancel();

            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = 'ja-JP';
            currentUtterance.rate = 1.0;
            currentUtterance.pitch = 1.0;

            const voices = speechSynthesis.getVoices();
            const jaVoice = voices.find(function(voice) { return voice.lang.startsWith('ja'); });
            if (jaVoice) {
                currentUtterance.voice = jaVoice;
            }

            speechSynthesis.speak(currentUtterance);
        }

        if ('speechSynthesis' in window) {
            speechSynthesis.onvoiceschanged = function() {
                speechSynthesis.getVoices();
            };
        }

        const conversationState = {
            stage: 'initial',
            data: {
                date: '',
                location: '',
                situation: '',
                action: '',
                result: '',
                cause: '',
                prevention: '',
                workerName: '',
                reporterRole: ''
            }
        };

        const questions = {
            initial: {
                message: "こんにちは。ヒヤリハット事例の報告をお願いします。\n\nまず、いつ起きたことですか?（例：今日、昨日、1月15日など）",
                field: 'date',
                next: 'location'
            },
            location: {
                message: "ありがとうございます。\n\nどこで起きましたか?（例：A区画の斜面、作業道沿い、○○山の伐採現場など）",
                field: 'location',
                next: 'situation'
            },
            situation: {
                message: "わかりました。\n\nどんな状況でしたか? 何をしていた時に起きたのか、できるだけ詳しく教えてください。",
                field: 'situation',
                next: 'action'
            },
            action: {
                message: "その時、何が起こりましたか？",
                field: 'action',
                next: 'result'
            },
            result: {
                message: "結果はどうでしたか? ケガはありましたか? 機械や道具に損傷はありましたか?",
                field: 'result',
                next: 'cause',
                buttons: ['ケガなし', '軽いケガ', '機械の損傷あり', '特に問題なし']
            },
            cause: {
                message: "なぜそのような状況になったと思いますか? 原因について思うことがあれば教えてください。",
                field: 'cause',
                next: 'prevention'
            },
            prevention: {
                message: "今後同じことが起きないようにするには、どうすればいいと思いますか?",
                field: 'prevention',
                next: 'workerName'
            },
            workerName: {
                message: "最後に、報告者のお名前を教えてください。（匿名希望の場合は「匿名」と入力してください）",
                field: 'workerName',
                next: 'complete'
            },
            complete: {
                message: "ありがとうございました。報告書を作成しました。\n\n内容を確認して、必要に応じて共有してください。",
                field: null,
                next: null
            }
        };

        function addMessage(content, isUser, shouldSpeak) {
            if (shouldSpeak === undefined) shouldSpeak = true;
            
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message ' + (isUser ? 'message-right' : 'message-left');
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble ' + (isUser ? 'bubble-user' : 'bubble-bot');
            bubble.textContent = content;
            
            messageDiv.appendChild(bubble);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;

            if (!isUser && shouldSpeak) {
                speakText(content);
            }
        }

        function showTypingIndicator() {
            const chatArea = document.getElementById('chatArea');
            const indicatorDiv = document.createElement('div');
            indicatorDiv.id = 'typingIndicator';
            indicatorDiv.className = 'chat-message message-left';
            indicatorDiv.innerHTML = '<div class="bubble bubble-bot"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
            chatArea.appendChild(indicatorDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function showButtons(buttons) {
            const buttonArea = document.getElementById('buttonArea');
            buttonArea.innerHTML = '';
            
            if (buttons && buttons.length > 0) {
                buttons.forEach(function(buttonText) {
                    const button = document.createElement('button');
                    button.textContent = buttonText;
                    button.className = 'btn-quick';
                    button.onclick = function() {
                        document.getElementById('userInput').value = buttonText;
                        sendMessage();
                    };
                    buttonArea.appendChild(button);
                });
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            speechSynthesis.cancel();
            
            addMessage(message, true, false);
            input.value = '';
            
            document.getElementById('buttonArea').innerHTML = '';
            
            const currentQuestion = questions[conversationState.stage];
            if (currentQuestion.field) {
                conversationState.data[currentQuestion.field] = message;
            }
            
            conversationState.stage = currentQuestion.next;
            
            showTypingIndicator();
            setTimeout(function() {
                hideTypingIndicator();
                
                if (conversationState.stage === 'complete') {
                    addMessage(questions.complete.message);
                    setTimeout(function() {
                        generateReport();
                    }, 1000);
                } else {
                    const nextQuestion = questions[conversationState.stage];
                    addMessage(nextQuestion.message);
                    if (nextQuestion.buttons) {
                        showButtons(nextQuestion.buttons);
                    }
                }
            }, 1000);
        }

        function generateReport() {
            const data = conversationState.data;
            const now = new Date();
            const reportDate = now.toLocaleString('ja-JP');
            
            const reportHTML = '<div class="report-alert"><p style="font-size: 0.875rem; color: #6b7280;">報告日時: ' + reportDate + '</p></div>' +
                '<div class="report-section"><div class="report-label">📅 発生日時</div><div class="report-value">' + data.date + '</div></div>' +
                '<div class="report-section"><div class="report-label">📍 発生場所</div><div class="report-value">' + data.location + '</div></div>' +
                '<div class="report-section"><div class="report-label">⚠️ 状況・経緯</div><div class="report-value">' + data.situation + '</div></div>' +
                '<div class="report-section"><div class="report-label">🔄 取った行動</div><div class="report-value">' + data.action + '</div></div>' +
                '<div class="report-section"><div class="report-label">📊 結果</div><div class="report-value">' + data.result + '</div></div>' +
                '<div class="report-section"><div class="report-label">🔍 原因分析</div><div class="report-value">' + data.cause + '</div></div>' +
                '<div class="report-section"><div class="report-label">✅ 再発防止策</div><div class="report-value">' + data.prevention + '</div></div>' +
                '<div class="report-info"><p style="font-size: 0.875rem; color: #374151;"><strong>報告者:</strong> ' + data.workerName + '</p></div>';
            
            document.getElementById('reportContent').innerHTML = reportHTML;
            document.getElementById('modalTitle').textContent = '📋 ヒヤリハット報告書';
            
            const buttonContainer = document.getElementById('modalButtons');
            buttonContainer.innerHTML = '<button class="btn-modal btn-green" onclick="copyReport()">📋 コピーする</button>' +
                '<button class="btn-modal btn-blue" onclick="downloadReport()">💾 ダウンロード</button>' +
                '<button class="btn-modal btn-purple" onclick="generateStory()">📖 物語にする</button>' +
                '<button class="btn-modal btn-gray" onclick="closeModal()">閉じる</button>';
            
            document.getElementById('reportModal').classList.remove('hidden');
        }

        function getReportText() {
            const data = conversationState.data;
            const now = new Date();
            const reportDate = now.toLocaleString('ja-JP');
            
            return '━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n' +
                '林業ヒヤリハット報告書\n' +
                '━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n' +
                '報告日時: ' + reportDate + '\n\n' +
                '【発生日時】\n' + data.date + '\n\n' +
                '【発生場所】\n' + data.location + '\n\n' +
                '【状況・経緯】\n' + data.situation + '\n\n' +
                '【取った行動】\n' + data.action + '\n\n' +
                '【結果】\n' + data.result + '\n\n' +
                '【原因分析】\n' + data.cause + '\n\n' +
                '【再発防止策】\n' + data.prevention + '\n\n' +
                '【報告者情報】\n' +
                '報告者: ' + data.workerName + '\n\n' +
                '━━━━━━━━━━━━━━━━━━━━━━━━━━━━';
        }

        function copyReport() {
            const reportText = getReportText();
            navigator.clipboard.writeText(reportText).then(function() {
                alert('報告書をクリップボードにコピーしました！');
            });
        }

        function downloadReport() {
            const reportText = getReportText();
            const blob = new Blob([reportText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ヒヤリハット報告_' + new Date().toISOString().split('T')[0] + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function closeModal() {
            document.getElementById('reportModal').classList.add('hidden');
            
            setTimeout(function() {
                const buttonArea = document.getElementById('buttonArea');
                buttonArea.innerHTML = '';
                const restartButton = document.createElement('button');
                restartButton.textContent = '🔄 新しい報告を作成';
                restartButton.className = 'btn-green';
                restartButton.style.padding = '0.75rem 1.5rem';
                restartButton.style.borderRadius = '0.5rem';
                restartButton.style.fontWeight = '600';
                restartButton.style.cursor = 'pointer';
                restartButton.style.border = 'none';
                restartButton.onclick = function() { location.reload(); };
                buttonArea.appendChild(restartButton);
            }, 300);
        }

        function generateStory() {
            const data = conversationState.data;
            
            const patterns = [
                generatePattern1(data),
                generatePattern2(data),
                generatePattern3(data),
                generatePattern4(data),
                generatePattern5(data)
            ];
            
            const randomIndex = Math.floor(Math.random() * patterns.length);
            const story = patterns[randomIndex];
            
            const reportContent = document.getElementById('reportContent');

        function getStoryText() {
            return window.currentStory || '';
        }

        function copyStory() {
            const storyText = getStoryText();
            navigator.clipboard.writeText(storyText).then(function() {
                alert('物語をクリップボードにコピーしました！');
            });
        }

        function downloadStory() {
            const storyText = getStoryText();
            const blob = new Blob([storyText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '安全教育物語_' + new Date().toISOString().split('T')[0] + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function backToReport() {
            generateReport();
        }
